name: Build Brokerlynx APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Quick safety check (JavaScript syntax of every app file)
        run: |
          set -e
          for f in $(find app/src/main/assets/public/js -name '*.js'); do node --check "$f"; done
          echo "All JavaScript files parse correctly."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME). We only accept
      # licenses so Gradle can auto-download any missing platform/build-tools.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare signing key (only if you added the secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/brokerlynx.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/brokerlynx.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::warning::No signing key found. Building an UNSIGNED-RELEASE substitute (debug APK). Add the secrets to build the real release APK."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VC=$((GITHUB_RUN_NUMBER + 1))
          if [ "$SIGNED" = "yes" ]; then
            ./gradlew --no-daemon assembleRelease -PbbVersionCode=$VC -PbbVersionName="1.0.$GITHUB_RUN_NUMBER"
          else
            ./gradlew --no-daemon assembleDebug -PbbVersionCode=$VC -PbbVersionName="1.0.$GITHUB_RUN_NUMBER"
          fi

      - name: Name the APK and show its signing fingerprint
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$APK" "dist/Brokerlynx-1.0.${GITHUB_RUN_NUMBER}.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "dist/Brokerlynx-1.0.${GITHUB_RUN_NUMBER}.apk" | grep -E "SHA-256|Verifies" || true
          echo "Same SHA-256 digest on every build = customers can update over the old app."

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Brokerlynx-APK
          path: dist/*.apk
          if-no-files-found: error
